name: Unit Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history. TWO tests assert their gate REDS on a historical tree:
          #   check-branch-task.test.ts   → tasks.md at 9e538e07 (merged #377, no T1.2.3 row)
          #   check-progress-sync.test.ts → progress.md at 49679dd9 (the rotted version)
          # Under the default fetch-depth 1 neither object exists, `git show` throws, and in both
          # cases the two examples carrying the whole point (the historical red AND its positive
          # control) never run.
          #
          # #380 review put the distinction exactly: pinning the sha fixed "WHICH tree", not
          # "is the tree here". Two different failures, and the first fix reads like it covers both.
          #
          # A test whose evidence lives in repository HISTORY is not hermetic — the runner's
          # checkout is part of its fixture. Vendoring copies of the old files was the alternative;
          # it would be hermetic and also copies that no longer prove anything about what shipped.
          fetch-depth: 0

      - uses: pnpm/action-setup@v5
        with:
          version: '10.32.1'

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm -r build

      # Hard gate: no Node-only builtin (child_process/fs/…) may be statically imported by a
      # browser-facing @aastar/sdk subpath. Guards against regressions like the 0.42.0
      # node:child_process leak into @aastar/sdk/operator that broke downstream browser builds.
      - name: Check browser-safe subpaths
        run: pnpm run check:browser

      # Hard gate: config.{network}.json must agree with @aastar/core CANONICAL_ADDRESSES
      # (the single source of truth for contract addresses). See P2.8.
      # Was advisory (continue-on-error) while known drift was being reconciled — the stale
      # OP-mainnet copy in config.op-sepolia.json, a sepolia `pnts` mismatch, a suspected
      # canonical simpleAccountFactory typo. All resolved; verified clean across chains
      # 10 / 11155111 / 11155420, so it is now a blocking gate as that note intended.
      - name: Check contract-address consistency
        run: pnpm run check:addresses

      # Hard gate: no silent stub (a contract-coupled write path that returns success without
      # actually submitting) may ship in packages/*/src. Guards the class of bug behind #169,
      # where a roleData='0x' stub reached production as a bare on-chain revert.
      - name: Check for silent stubs
        run: pnpm run check:stubs

      # Hard gate: the RepCredit evidence runner's own sources and the ABI-provenance gate are
      # linted directly. `pnpm run lint` wraps `pnpm -r lint` first, and that is a NO-OP in this
      # monorepo ("None of the selected packages has a 'lint' script"), so wiring the wrapper in
      # here would have added a green step that ran no linter at all. This calls the real one
      # (CC-50 round-10 LOW). Its config is deliberately narrow — `no-restricted-imports` and
      # `@typescript-eslint/no-unused-vars` are the only rules enabled — so read it as "these two
      # rules hold", not as "the runner is linted".
      - name: Lint the RepCredit runner and the ABI-provenance gate
        run: pnpm run lint:repcredit

      # AASTAR_ONCHAIN_TEST=1 turns on the address-book assertions that read the CHAIN
      # (packages/core/src/addresses.threeLegs.test.ts). Without it those four tests SKIP, and the
      # suite still reports green off the one remaining offline assertion — measured: 2 passed,
      # 4 skipped. The whole point of that file is the four that were skipping, so the flag being
      # absent here made it decorative. (T5.1.1; caught in review after the file's own comment
      # claimed CI set a flag that nothing set.)
      #
      # A public endpoint is used because these are public reads on a public testnet. If it proves
      # flaky the fix is a keyed endpoint in the secret store — not dropping the flag, which would
      # silently restore the skipping.
      - name: Run unit tests
        env:
          AASTAR_ONCHAIN_TEST: '1'
          SEPOLIA_RPC_URL: https://ethereum-sepolia-rpc.publicnode.com
        run: pnpm -r test

      # `pnpm -r` iterates the workspace PACKAGES and skips the workspace root, so nothing above
      # runs a test file that lives in `scripts/`. Measured: `security-scan.test.ts` (merged in
      # #339) and `upstream/abi-signature.test.ts` had never executed in CI — they were verified by
      # running vitest by hand, which is exactly how a test can look green and still not be a gate.
      # `scripts/repcredit/**` is excluded because `repcredit:test` already covers it in two other
      # jobs; this step is precisely the remainder.
      - name: Run root-level tests (scripts/, excluding repcredit)
        run: pnpm run test:scripts

      # The ledger is the only record of work deferred rather than done, and its ids are referenced
      # from PR bodies and task comments. A duplicate id makes every one of those references
      # ambiguous, and nothing else in the repo has an opinion about it — see FU-26.
      - name: Check the follow-up ledger (unique ids, no conflict markers)
        run: pnpm run check:followups

      # The planning docs state what a PR did; GitHub states what it is. Two hand-written ledgers
      # cannot check each other — they drift independently, and the case that matters (both stale in
      # the same direction) is exactly the one that comparison misses. See FU-25.
      - name: Reconcile PR claims against GitHub
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # checkout leaves a detached HEAD on pull_request, so `gh pr view` has no branch to
          # resolve. The event knows which PR this is; asking it needs no subprocess.
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: pnpm run check:task-ledger

      # A branch that NAMES a task must have that task in the ledger. T1.2.3 was built, reviewed
      # twice and merged with no row at all — and both gates above were green, correctly: a row
      # that was never written is in nobody's scope.
      #
      # No `env:` here, and that is deliberate. The first version set `GITHUB_HEAD_REF` explicitly;
      # `GITHUB_*` is a reserved prefix and it was also redundant, since Actions already sets that
      # variable on pull_request events. (It was NOT the cause of the zero-run episode on #379 —
      # that was a merge conflict, see FU-74. Two separate things, recorded separately.)
      - name: Every task named by the branch is actually written down
        if: github.event_name == 'pull_request'
        run: pnpm run check:branch-task

      # progress.md is read as "what is true right now", and nothing checked it. It sat un-updated
      # across ~20 merged PRs while every other ledger gate stayed green, correctly: none of them
      # reads this file.
      - name: progress.md quotes the same statuses the ledger defines
        run: pnpm run check:progress-sync

      # A hand-written ABI in shipped source must say why. `packages/dapp` shipped a publicly
      # exported method calling `registerValidator(bytes)` — a function on no contract in this repo
      # — because the repo's own `parseAbi` ban never runs (no package defines a `lint` script, so
      # `pnpm -r lint` is a no-op) and its only caller printed the same line whether or not the
      # function existed. Baseline of 8 pre-existing files; it may only shrink.
      - name: Hand-written ABIs in shipped source carry a justification
        run: pnpm run check:hardcoded-abi

      # An address written into a PASS line is a claim nothing checks. `dvt-onboard-e2e` reported
      # "proven on live Sepolia 0x539B" for two upstream bumps while actually registering on the
      # canonical committee validator — and a wrong DVT validator does not revert (the superseded
      # one still has code and still answers isRegistered=true), so the printed line was the only
      # thing a reader had, and it lied on the green path.
      - name: Evidence runners must not hardcode a hex address in a printed line
        run: pnpm run check:evidence-literals

      # One package version must resolve to ONE physical copy. The root pinned typescript@5.6.3
      # while 16 workspace packages pinned 5.7.2, so pnpm installed viem/ox/abitype TWICE — and two
      # copies of one version are two nominally distinct types. `PublicClient` from tests/ did not
      # satisfy `PublicClient` from @aastar/core, the diagnostic said "…68 more…" vs "…67 more…",
      # and every call across that boundary carried an `as any` that read as noise. Fixing it took
      # the root tsc diagnostics 1246 -> 696 (#404).
      - name: One package version, one physical copy
        run: pnpm run check:dep-dedupe


      # A PR that says it closes a follow-up must actually close it, in the ledger on its own branch.
      # Two entries drifted in one night without either being a lapse of care — both had a moment
      # where the bookkeeping COULD be deferred, and a deferrable step gets deferred. See FU-43.
      - name: Follow-ups a PR claims to close must be closed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: pnpm run check:followup-closure

      # The count of whitelist entries nobody can verify may not grow. This does not judge the
      # existing eleven and does not judge any balance — only that a NEW opaque entry has to be
      # argued for. Wired here because a report with no consumer decays into a file, which is
      # precisely what happened to security-scan.ts (FU-44).
      - name: Whitelisted keys must stay verifiable
        env:
          SEPOLIA_RPC_URL: https://ethereum-sepolia-rpc.publicnode.com
        run: pnpm run audit:secret-whitelist

      # anvil: the RepCredit negative-control suite drives REAL viem against a REAL chain to prove
      # `extractRevertData` reads revert bytes and not the contract address / decoded args / calldata
      # (CC-50 round-4 HIGH-1). Hand-built error objects could not have caught that bug, so the
      # regression is worthless if it is allowed to skip — REPCREDIT_ANVIL_TEST=1 below makes a
      # missing anvil a failure.
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      # Hard gate: the RepCredit evidence runner's negative controls must be falsifiable.
      # These tests break each guarded security property and assert the control throws — the
      # regression they lock down is CC-50 H1, where every control had its sentinel throw inside
      # its own try/catch, so an attack that SUCCEEDED was recorded as evidence and the run
      # still reported "passed". `pnpm -r test` does not reach scripts/, hence a separate step.
      #
      # REPCREDIT_UPSTREAM_ARTIFACTS=absent: this runner has no sibling SuperPaymaster /
      # airaccount-contract checkouts (see the rationale block below). The REAL must-verify pin
      # check now FAILS on a missing artifact instead of reporting "0/4 measured" and staying
      # green (CC-50 round-9 LOW), so an environment without upstreams has to declare itself.
      # The result is a SKIPPED test, visible in the vitest summary — never a PASS. Release runs
      # (docs/RELEASE-CHECKLIST.md) do NOT set it, so there the check must measure 4/4.
      - name: RepCredit negative-control reverse tests
        env:
          REPCREDIT_ANVIL_TEST: '1'
          REPCREDIT_UPSTREAM_ARTIFACTS: 'absent'
        run: pnpm run repcredit:test

      # Type-checks the evidence runner and its fixtures. It is not part of any package build.
      - name: RepCredit runner typecheck
        run: pnpm run repcredit:typecheck

      # ---------------------------------------------------------------------------------
      # DELIBERATELY NOT IN CI: abi:sync / check:abi / check:abi-drift
      #
      # These three compare the SDK's vendored ABIs against the upstream contract repos —
      # SuperPaymaster, airaccount-contract, mycelium/launch — which must be checked out as
      # SIBLING directories and `forge build`-ed. A GitHub Actions runner has none of them,
      # so all three find nothing to compare against and exit 0. Measured on a clean
      # `git archive` checkout with no siblings, they used to report:
      #
      #   check:abi-drift → "no upstream out/ dirs found locally — skipping"     → exit 0
      #   check:abi       → "source not found locally — skipped" ×3, then PASS   → exit 0
      #   abi:sync        → "0 missing · 0 drifted · PASS: ABIs ... in sync"     → exit 0
      #
      # Wiring them in as-is would produce a green "ABIs verified against upstream" signal
      # from a run that compared against zero artifacts — worse than having no gate, because
      # it is actively misleading. (upstream-watch.yml documents the same constraint for the
      # full radar.) They stay a LOCAL / pre-release gate, per docs/RELEASE-CHECKLIST.md.
      #
      # Three changes now make that impossible to mistake for verification:
      #   * with no upstream present they no longer print PASS — they say explicitly that the
      #     run compared NOTHING and is a SKIP;
      #   * REQUIRE_UPSTREAM=1 turns "no upstream present" into a hard failure (exit 1);
      #   * `pnpm run check:abi-drift:strict` (= --strict) fails PER EXPECTED CONTRACT. The
      #     coarse "is any out/ dir present?" test was not enough: an upstream that had been
      #     `forge clean`ed still has its out/ dir for OTHER repos, so Registry/BLSAggregator
      #     silently dropped into `skipped` and the gate printed PASS after checking 12 ABIs
      #     instead of 30 (CC-50). Strict mode fails when a contract declared in an upstream
      #     src/ tree has no artifact, and when anything in MUST_VERIFY was not compared; both
      #     runs now print the full checked/skipped inventory either way.
      # The release checklist sets these flags.
      #
      # ROUND-10 UPDATE: the last sentence used to read "if these are ever to become real CI
      # gates, the runner must first check out and build the upstream repos, then run the strict
      # variant." That is now the `abi-provenance` job below, for SuperPaymaster — the repo all
      # four MUST_VERIFY contracts come from. It is a separate job for the same reason as
      # `repcredit-yaaa-http`: an upstream outage must read as "the upstream gate failed", never
      # as "everything is green". THIS job still does not run them, and its green still does not
      # mean the ABIs were verified against upstream.
      # ---------------------------------------------------------------------------------

  # ---------------------------------------------------------------------------------
  # The RepCredit experiment client talks to a REAL YAAA node over HTTP. Its guard-auth
  # suite is the only thing that proves the SDK's HMAC client actually gets past the
  # upstream admission gate — and that suite is worthless if it is allowed to skip.
  #
  # CC-50 round 3 [from:docs]: "CI/RELEASE 必须设置 REPCREDIT_YAAA_HTTP_TEST=1 …
  # 缺 YAAA checkout/artifact/HTTP 套件时 fail 而非 skip." So this job checks the
  # upstream out at a pinned ref, builds it, and runs the suite with the require flag:
  # a missing checkout, a missing build artifact, an artifact that predates the pinned
  # revision, or a node that will not boot all FAIL the job instead of skipping.
  #
  # The checkout is a separate job (not a step of `test`) so that the SDK's own gates
  # keep reporting independently of upstream availability — an upstream outage must be
  # visible as "the upstream gate failed", never as "everything is green".
  # ---------------------------------------------------------------------------------
  repcredit-yaaa-http:
    name: RepCredit YAAA HTTP guard (real node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          path: aastar-sdk

      # Pinned by ref on purpose: the suite verifies the SDK against a DECLARED upstream
      # revision, and REPCREDIT_YAAA_REV below makes a silent ref move a hard failure
      # rather than a quietly-different verification.
      #
      # BOTH literals must equal scripts/upstream-abi-pin.json ->
      # services["YetAnotherAA-Validator"].revision. In required mode that in-repo pin is
      # authoritative (CC-50 round-5 LOW-1), so any drift between the three fails this job:
      # move `ref` alone and the pin test reports "the checkout is at <other>"; move the env
      # alone and it reports the same; move both and it refuses the env override outright.
      - name: Check out the pinned YetAnotherAA-Validator revision
        uses: actions/checkout@v5
        with:
          repository: AAStarCommunity/YetAnotherAA-Validator
          ref: e0b5efe3c5e86bd070b6e9dc90f8ebd69c4133f9
          path: YetAnotherAA-Validator
          # No `token:`. This job had never run before CC-115 B4, and its first run failed with
          # "Input required and not supplied: token" — `secrets.YAAA_CHECKOUT_TOKEN` is not set on
          # this repository (the secret list is empty). It is also not needed: the validator repo
          # is public, so the default GITHUB_TOKEN can read it. Restoring a token input would mean
          # provisioning a credential to fetch something already world-readable.

      - uses: pnpm/action-setup@v5
        with:
          version: '10.32.1'

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: aastar-sdk/pnpm-lock.yaml

      # anvil: the suite boots a throwaway chain for the node to point at.
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Install SDK dependencies
        working-directory: aastar-sdk
        run: pnpm install --frozen-lockfile

      - name: Build the pinned YAAA node
        working-directory: YetAnotherAA-Validator
        run: |
          npm ci
          npm run build

      # The artifact must exist: without it the suite would skip, which is precisely the
      # failure mode this job exists to remove.
      - name: Assert the YAAA build artifact exists
        run: test -f YetAnotherAA-Validator/dist/main.js

      - name: RepCredit tests with the real YAAA HTTP suite REQUIRED
        working-directory: aastar-sdk
        env:
          REPCREDIT_YAAA_HTTP_TEST: '1'
          REPCREDIT_ANVIL_TEST: '1'
          REPCREDIT_YAAA_DIR: ${{ github.workspace }}/YetAnotherAA-Validator
          REPCREDIT_YAAA_REV: e0b5efe3c5e86bd070b6e9dc90f8ebd69c4133f9
          # Same reason as the unit-test job: no sibling contract checkouts on this runner.
          REPCREDIT_UPSTREAM_ARTIFACTS: 'absent'
        run: pnpm run repcredit:test

  # ---------------------------------------------------------------------------------
  # ABI PROVENANCE (CC-50 round-10 LOW): the strict drift gate, against a REAL upstream.
  #
  # The `test` job deliberately does not run `check:abi-drift` — with no sibling checkouts it
  # compares nothing and exits 0, which is worse than no gate. The answer is not to skip the
  # gate but to give it the inputs it needs: check SuperPaymaster out at the REVIEWED revision,
  # `forge build` it, and run `--strict`. All four MUST_VERIFY contracts (Registry,
  # BLSAggregator, DVTValidator, SuperPaymaster) come from that one repo, so a single checkout
  # is enough for the must-verify chain to be fully exercised.
  #
  # `ref` below MUST equal scripts/upstream-abi-pin.json -> repos.SuperPaymaster.revision. The
  # gate itself enforces the agreement in both directions: it fails if the checkout's HEAD is not
  # the pinned revision, if the checkout is dirty, if any must-verify artifact's sole compilation
  # target is not the pinned source path, or if the working-tree bytes of that path are not the
  # ones the pinned revision holds. So a drift between this literal and the pin file cannot pass.
  #
  # WHAT IS AND IS NOT VERIFIED. The gate itself is exercised hard: the synthetic suite in
  # scripts/repcredit/abi-drift-provenance.test.ts builds REAL git repos and runs THIS script
  # against them, including a clean-and-pinned baseline that passes strict. The `ref` literal
  # below is bound to scripts/upstream-abi-pin.json by unit tests, so the two cannot drift apart
  # unnoticed.
  #
  # This paragraph used to end with a status note that is no longer true. Replacing it took three
  # separate diagnoses, because THREE DIFFERENT THINGS WERE WRONG IN THREE DIFFERENT WAYS, and
  # each needs a different fix. Blaming both sentences to e4439dda (#329, 2026-09-04) — the very
  # commit that introduced this job:
  #
  #   1. "no `forge build` of 03713feb"  →  WRONG WHEN WRITTEN, not stale. The SAME commit set
  #      the pin to `d651646aee98e8b22c8abe5af079bd4bb0a35728` (upstream-abi-pin.json, and the
  #      `ref` below). The sentence named the revision the commit was moving OFF. Fix = correct
  #      the fact.
  #
  #   2. "no GitHub-hosted run has been performed in this round"  →  TRUE WHEN WRITTEN, then went
  #      stale. The job was being introduced right there, so it genuinely had never run. Measured
  #      2026-09-05, the five most recent CI runs that reached it (`main`, `chore/followups-*`,
  #      `feat/T1.2.1-*`, `feat/T2.1.1-*`): 5/5 `success`, ~3m36s–4m21s each, including on `main`.
  #      Fix = re-measure, and date the measurement.
  #
  #   3. "Treat a red first run as this job being wrong, not as the pin being unattributable"  →
  #      SOUND ADVICE WHOSE PREMISE EXPIRED. It followed correctly from (2) while (2) held. Now
  #      the job has a green track record, so a red here is more likely a real finding, and this
  #      sentence would send the next person to debug the runner while the gate is busy reporting
  #      an actual drift. Fix = re-derive the conclusion, not just the fact.
  #
  # (3) is the one worth remembering: a correct instruction does not announce itself when its
  # premise expires. Nothing here changed, nothing failed, and the advice quietly inverted.
  #
  # CURRENT READING: treat a red as a finding first. Suspect the job only after the gate's own
  # inventory line shows it compared nothing. And when you touch this, re-measure or delete the
  # numbers — an undated measurement is exactly what went stale above.
  #
  # WHEN B2 CLOSES this literal and the pin file move together, in the same commit as the
  # re-vendored ABIs — see docs/RELEASE-CHECKLIST.md and the CHANGELOG's B2 sequence.
  # ---------------------------------------------------------------------------------
  abi-provenance:
    name: ABI provenance (strict drift gate vs the pinned upstream)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          path: aastar-sdk

      # Sibling layout: check-abi-drift.ts resolves upstreams as ../<repo> from the SDK root.
      - name: Check out the pinned SuperPaymaster revision
        uses: actions/checkout@v5
        with:
          repository: AAStarCommunity/SuperPaymaster
          ref: d651646aee98e8b22c8abe5af079bd4bb0a35728
          path: SuperPaymaster
          # Only the foundry dependency submodules: `submodules: recursive` would also drag in
          # standards/ercs and friends, which the build does not need.
          submodules: false

      - name: Initialise the foundry dependency submodules
        working-directory: SuperPaymaster
        run: git submodule update --init --recursive contracts/lib

      # The pinned checkout must be CLEAN for the gate to attribute anything to it. Asserting it
      # here turns "a step above dirtied the tree" into its own, readable failure rather than an
      # UNUSABLE CHECKOUT further down.
      - name: Assert the upstream checkout is clean and at the pinned revision
        working-directory: SuperPaymaster
        run: |
          test "$(git rev-parse HEAD)" = "d651646aee98e8b22c8abe5af079bd4bb0a35728"
          test -z "$(git status --porcelain)"

      - uses: pnpm/action-setup@v5
        with:
          version: '10.32.1'

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: aastar-sdk/pnpm-lock.yaml

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Install SDK dependencies
        working-directory: aastar-sdk
        run: pnpm install --frozen-lockfile

      - name: Build the pinned upstream artifacts
        working-directory: SuperPaymaster
        run: forge build

      # Without out/ the strict gate would fail on "no upstream out/ dir is present"; asserting
      # the four must-verify artifacts exist names the missing input instead.
      - name: Assert the must-verify artifacts were produced
        run: |
          for c in Registry BLSAggregator DVTValidator SuperPaymaster; do
            test -f "SuperPaymaster/out/$c.sol/$c.json"
          done

      # NOTE: REPCREDIT_UPSTREAM_ARTIFACTS is deliberately NOT set here — this runner HAS the
      # upstream. Setting it alongside --strict is now an immediate, named failure (round-10).
      - name: Strict ABI drift + provenance gate
        working-directory: aastar-sdk
        run: pnpm run check:abi-drift:strict

      # CC-115 B4. The step above proves the vendored ABIs match the PINNED UPSTREAM. It says
      # nothing about whether that pin still matches the CHAIN — and "the pin and the chain quietly
      # disagree" is precisely the failure this PR was written about: for six days Registry pointed
      # at a new aggregator while SuperPaymaster and DVTValidator pointed at the old one, with no
      # pending rotation to hint that anything was unfinished.
      #
      # The mutation tests for these checks run under `repcredit:test`, so the gate is proved
      # falsifiable there. THIS step is the other half: does the frozen stack still read the way the
      # pin says. Without it, nothing in CI would ever have executed the comparison (measured:
      # `grep -rn 'deployed-stack' .github/ package.json` returned zero, while the same grep for
      # check-abi-drift returned four).
      #
      # REPCREDIT_REQUIRE_ONCHAIN=1 on purpose: "the RPC was unreachable" must read as a failed
      # gate, never as a silent pass. A public endpoint is used because the values being read are
      # public reads on a public testnet; if it proves flaky, the fix is a keyed endpoint in the
      # secret store, not dropping the requirement.
      - name: Deployed-stack pin gate (does the frozen stack still read this way?)
        working-directory: aastar-sdk
        env:
          REPCREDIT_REQUIRE_ONCHAIN: '1'
          SEPOLIA_RPC_URL: https://ethereum-sepolia-rpc.publicnode.com
        run: pnpm run check:deployed-stack
