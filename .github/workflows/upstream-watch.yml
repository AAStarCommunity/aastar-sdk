# Upstream Sync Watcher
#
# The AAStar SDK vendors 4 upstream stacks (AirAccount contracts, SuperPaymaster,
# KMS = the AirAccount runtime repo, DVT = YetAnotherAA-Validator). When any of
# them cuts a new release, the SDK's pinned ABIs / addresses / API references go
# stale and on-chain calls silently break.
#
# This workflow is the CI half of the radar. It CANNOT run the full local radar
# (scripts/upstream/upstream-radar.ts) because that needs the 4 upstream repos
# checked out side-by-side on a developer machine (ABIs in out/, deployment docs,
# the openapi.yaml). What CI *can* cheaply do is read each upstream's latest
# version from GitHub, compare it to the version this SDK pins in the README
# "Integration Infrastructure" table, and open/update a tracking issue when an
# upstream has moved ahead.
#
# What it compares is a VERSION LABEL, nothing more. A redeploy without a tag, or an
# ABI change inside a tag, is invisible here — that is the local radar's job and,
# ultimately, an on-chain read-back.
#
# It is ADVISORY ONLY — it never fails the build; it just notifies. A human then
# runs the local radar (`pnpm run upstream:check` / `--rehearse`) and the sync
# playbook in docs/UPSTREAM-SYNC.md.
#
# Upstream data (tag names, spec contents) is UNTRUSTED. It travels only through
# files and environment variables, never through `${{ }}` substitution into a
# script: until 2026-10 the issue body was built as `$(printf '%b' "${{ steps.compare.outputs.drift }}")`,
# so every backticked tag name in it was executed as a shell command (the log shows
# `v1.15.0: command not found`) and issue #220 was published with every value blank.
# A tag named `$(…)` would have run with this job's issues:write token.

name: upstream-watch

on:
  schedule:
    # Daily at 06:00 UTC. Cheap; upstream releases are infrequent.
    - cron: "0 6 * * *"
  workflow_dispatch: {} # manual "check now" button

permissions:
  contents: read
  issues: write # to open/update the tracking issue

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout SDK (for the README pins)
        uses: actions/checkout@v4

      - name: Compare upstream latest versions against SDK pins
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          DRIFT_FILE="${RUNNER_TEMP}/upstream-drift.md"

          # Format: "<github-repo>|<readme-name>|<source>"
          #   tag:<ERE>    highest tag (version sort) whose name matches <ERE>. Stable
          #                semver only: snapshot tags (repcredit-pre550-snapshot-…) and
          #                pre-releases are not releases, and "most recent tag" picked them.
          #   spec:<path>  info.version of an OpenAPI file on the default branch — the
          #                KMS pin IS the spec version, and that repo's newest tag is a
          #                different product (airaccount-node-v*), so its tags cannot answer.
          # GitHub "latest release" is NOT used: airaccount-contract's latest Release is
          # v0.27.0 while its tags reached v0.33.0, which reported the SDK pin as drifted
          # BACKWARDS.
          UPSTREAMS=(
            "AAStarCommunity/airaccount-contract|AirAccount|tag:^v[0-9]+\.[0-9]+\.[0-9]+$"
            "AAStarCommunity/SuperPaymaster|SuperPaymaster|tag:^v[0-9]+\.[0-9]+\.[0-9]+$"
            "AAStarCommunity/AirAccount|KMS|spec:kms/docs/api/openapi.yaml"
            "AAStarCommunity/YetAnotherAA-Validator|DVT|tag:^v[0-9]+\.[0-9]+\.[0-9]+$"
          )

          # Pull the pinned version for a README-table row. Rows look like:
          #   | **AirAccount** (contracts) | `v0.18.0-beta.2` | ... |
          # We grab the first backticked cell on the row whose bold name matches.
          read_pin() {
            local name="$1"
            # shellcheck disable=SC2016
            grep -E "^\|\s*\*\*${name}\*\*" README.md \
              | head -1 \
              | grep -oE '`[^`]+`' \
              | head -1 \
              | tr -d '`'
          }

          # Normalize a version string for comparison: drop a leading "openapi "
          # and a leading "v".
          norm() { sed -E 's/^openapi //I; s/^v//I' <<<"$1" | tr -d '[:space:]'; }

          # Only a plain version may reach the report: anything else is printed as
          # <unparseable> so a hostile tag cannot inject markdown or mentions.
          is_plain() { [[ "$1" =~ ^[A-Za-z0-9._\ -]{1,64}$ ]]; }
          safe() { if is_plain "$1"; then printf '%s' "$1"; else printf '<unparseable>'; fi; }

          latest_version() {
            local repo="$1" source="$2"
            case "${source}" in
              tag:*)
                gh api --paginate "repos/${repo}/tags?per_page=100" --jq '.[].name' \
                  | grep -E "${source#tag:}" | sort -V | tail -1 || true
                ;;
              spec:*)
                gh api -H "Accept: application/vnd.github.raw" "repos/${repo}/contents/${source#spec:}" \
                  | grep -m1 -E '^[[:space:]]+version:' | sed -E 's/^[[:space:]]+version:[[:space:]]*//; s/["'\'']//g' || true
                ;;
            esac
          }

          : > "${DRIFT_FILE}"
          for entry in "${UPSTREAMS[@]}"; do
            IFS='|' read -r repo name source <<<"${entry}"

            pin="$(read_pin "${name}" || true)"
            latest="$(latest_version "${repo}" "${source}" || true)"
            # An unparseable value is not a version: it must not be version-sorted into a verdict.
            why=""
            if [ -n "${latest}" ] && ! is_plain "${latest}"; then latest=""; why=" (value was not a plain version)"; fi

            echo "::group::${name} (${repo}, ${source%%:*})"
            echo "  SDK pin    : $([ -n "${pin}" ] && safe "${pin}" || echo '<none>')"
            echo "  upstream   : $([ -n "${latest}" ] && safe "${latest}" || echo "<none>${why}")"

            if [ -z "${pin}" ] || [ -z "${latest}" ]; then
              # Not silent: an upstream we could not read is reported, not skipped as in-sync.
              echo "  -> UNRESOLVED"
              # shellcheck disable=SC2016
              printf -- '- **%s** (`%s`): could not resolve %s — check the workflow log\n' \
                "${name}" "${repo}" "$([ -z "${pin}" ] && echo 'the README pin' || echo "the upstream version (${source%%:*})${why}")" >> "${DRIFT_FILE}"
            elif [ "$(norm "${pin}")" = "$(norm "${latest}")" ]; then
              echo "  -> in-sync"
            else
              higher="$(printf '%s\n%s\n' "$(norm "${pin}")" "$(norm "${latest}")" | sort -V | tail -1)"
              if [ "${higher}" = "$(norm "${pin}")" ]; then how="SDK pin is AHEAD of upstream (pin source or upstream tagging is wrong)"; else how="upstream is newer"; fi
              echo "  -> DRIFT: ${how}"
              # shellcheck disable=SC2016
              printf -- '- **%s** (`%s`): SDK pins `%s`, upstream is `%s` — %s\n' \
                "${name}" "${repo}" "$(safe "${pin}")" "$(safe "${latest}")" "${how}" >> "${DRIFT_FILE}"
            fi
            echo "::endgroup::"
          done

          echo "--- drift report ---"
          cat "${DRIFT_FILE}"

      - name: Open, update or close the drift tracking issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          DRIFT_FILE="${RUNNER_TEMP}/upstream-drift.md"

          TITLE="upstream drift: one or more upstreams have a newer release"
          existing=$(gh issue list --state open --search "in:title \"upstream drift\"" \
            --json number,title --jq ".[] | select(.title==\"${TITLE}\") | .number" | head -1 || true)

          if [ ! -s "${DRIFT_FILE}" ]; then
            if [ -n "${existing}" ]; then
              echo "No drift; closing tracking issue #${existing}"
              gh issue close "${existing}" --comment "All 4 README pins match upstream as of $(date -u +%Y-%m-%dT%H:%MZ)."
            else
              echo "No drift."
            fi
            exit 0
          fi

          BODY_FILE="${RUNNER_TEMP}/upstream-drift-body.md"
          {
            echo "The scheduled \`upstream-watch\` workflow found README pins that do not match upstream:"
            echo
            cat "${DRIFT_FILE}"
            echo
            echo "This compares version LABELS only. Matching labels do not prove matching ABIs or"
            echo "addresses, and a differing label does not prove the SDK must change."
            echo
            echo "## Next steps (advisory)"
            echo
            echo "1. Fetch the upstream repos locally (\`git fetch\`; the radar reports when a checkout is not at origin)."
            echo "2. Run the full local radar:"
            echo "   \`\`\`bash"
            echo "   pnpm run upstream:check        # per-upstream drift report (version/ABI/addresses/API)"
            echo "   pnpm run upstream:rehearse     # + gates + concrete upgrade worklist"
            echo "   \`\`\`"
            echo "3. Follow the sync playbook in \`docs/UPSTREAM-SYNC.md\` to update the"
            echo "   ABIs, version pins, addresses, and API references, then re-run the"
            echo "   RELEASE-CHECKLIST gates."
            echo
            echo "_This issue is auto-managed by \`.github/workflows/upstream-watch.yml\` and"
            echo "is advisory only — it does not block CI. It closes itself when every pin matches._"
          } > "${BODY_FILE}"

          if [ -n "${existing}" ]; then
            current="$(gh issue view "${existing}" --json body --jq .body)"
            if [ "${current}" = "$(cat "${BODY_FILE}")" ]; then
              # Same finding as yesterday: no comment. #220 collected 124 identical
              # "Re-detected" comments, which buried the one that mattered.
              echo "Tracking issue #${existing} already says this; nothing to do"
            else
              echo "Updating tracking issue #${existing}"
              gh issue edit "${existing}" --body-file "${BODY_FILE}"
              gh issue comment "${existing}" --body "Drift changed on $(date -u +%Y-%m-%dT%H:%MZ) — see updated body."
            fi
          else
            echo "Opening new tracking issue"
            gh issue create --title "${TITLE}" --body-file "${BODY_FILE}" --label "upstream-sync" || \
              gh issue create --title "${TITLE}" --body-file "${BODY_FILE}"
          fi
